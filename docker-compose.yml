# Spendly AI with its own MongoDB.
#   export SESSION_SECRET=$(openssl rand -hex 32)
#   docker compose up --build
# Then open http://localhost:4000. Put a TLS-terminating reverse proxy in front for real use
# (see docs/DEPLOYMENT.md) and set APP_ORIGIN to its public address.

services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/spendly
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET (openssl rand -hex 32)}
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:4000}
      # plain http on localhost; set COOKIE_SECURE=true (the production default) behind HTTPS
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - AI_PROVIDER=${AI_PROVIDER:-none}
      # optional: passed through only when set in your shell
      - AI_MODEL
      - AI_API_KEY
      - AI_BASE_URL
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  uploads:
  mongo:
